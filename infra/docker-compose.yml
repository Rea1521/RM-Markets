# Full microservice topology on one machine:
#   nginx (load balancer, :8080) -> market-data (feed + /api/market + /ws)
#                                 -> trading-api x2 (auth, trading, social, journal, competitions, graphql)
#                                 -> analytics-api (analytics, backtests, options, ML, screener)
#   postgres + redis (pub/sub between services, shared quote cache, rate limits)
#   web (React build served by node, :4173)
# Usage:  docker compose -f infra/docker-compose.yml up --build
x-api: &api
  build: ../backend
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  environment: &api-env
    APP_ENV: production
    DATABASE_URL: postgresql://rm:rm@postgres:5432/rmmarkets
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-0123456789}
    CORS_ORIGINS: "*"
    RUN_MARKET_FEED: "false"
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    POLYGON_API_KEY: ${POLYGON_API_KEY:-}
    FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    NEWSAPI_KEY: ${NEWSAPI_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: rmmarkets, POSTGRES_USER: rm, POSTGRES_PASSWORD: rm }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rm -d rmmarkets"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  market-data:
    <<: *api
    environment:
      <<: *api-env
      SERVICE_MODE: market
      RUN_MARKET_FEED: "true"

  trading-api:
    <<: *api
    deploy: { replicas: 2 }
    environment:
      <<: *api-env
      SERVICE_MODE: trading

  analytics-api:
    <<: *api
    environment:
      <<: *api-env
      SERVICE_MODE: analytics

  nginx:
    image: nginx:1.28-alpine
    depends_on: [market-data, trading-api, analytics-api]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["8080:80"]

  web:
    build:
      context: ../web
      args: { VITE_API_URL: "http://localhost:8080" }
    ports: ["4173:4173"]
    depends_on: [nginx]

volumes:
  pgdata:

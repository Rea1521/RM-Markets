apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: rm-markets }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/YOUR_GITHUB_USER/rm-markets-web:latest
          ports: [{ containerPort: 4173 }]
          readinessProbe: { httpGet: { path: /, port: 4173 } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: rm-markets }
spec: { selector: { app: web }, ports: [{ port: 80, targetPort: 4173 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rm-markets
  namespace: rm-markets
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls: [{ hosts: [rm-markets.example.com, api.rm-markets.example.com], secretName: rm-markets-tls }]
  rules:
    - host: api.rm-markets.example.com
      http:
        paths:
          - { path: /ws, pathType: Prefix, backend: { service: { name: market-data, port: { number: 8000 } } } }
          - { path: /api/market, pathType: Prefix, backend: { service: { name: market-data, port: { number: 8000 } } } }
          - { path: /api/analytics, pathType: Prefix, backend: { service: { name: analytics-api, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: trading-api, port: { number: 8000 } } } }
    - host: rm-markets.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }

worker_processes auto;
events { worker_connections 4096; }

http {
  # Docker's DNS returns every replica of a service; nginx round-robins / least_conn across them
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;

  upstream market    { zone market 64k;    server market-data:8000 resolve; }
  upstream trading   { zone trading 64k;   least_conn; server trading-api:8000 resolve; }
  upstream analytics { zone analytics 64k; least_conn; server analytics-api:8000 resolve; }

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hist:20m max_size=500m inactive=30m;

  server {
    listen 80;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/plain;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req zone=perip burst=60 nodelay;

    location /ws {
      proxy_pass http://market;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    # historical candles are CDN/edge cacheable (backend sends s-maxage)
    location /api/market/history/ {
      proxy_pass http://market;
      proxy_cache hist;
      proxy_cache_valid 200 30s;
      add_header X-Cache-Status $upstream_cache_status;
    }
    location /api/market/   { proxy_pass http://market; }
    location /api/analytics/ { proxy_pass http://analytics; proxy_read_timeout 120s; }
    location /api/           { proxy_pass http://trading; }
    location /graphql        { proxy_pass http://trading; }
    location /health         { proxy_pass http://trading; }
    location /               { proxy_pass http://trading; }
  }
}

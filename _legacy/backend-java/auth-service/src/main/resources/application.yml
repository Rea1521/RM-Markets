server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:rmmarkets;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwtSecret: secret-dev-key-please-change
  jwtExpirationMs: 3600000

name: CI/CD

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: rmtest, POSTGRES_USER: rm, POSTGRES_PASSWORD: rm }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rm" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests (SQLite, in-memory cache)
        run: pytest -q
      - name: Integration tests (PostgreSQL + Redis)
        env: { DATABASE_URL: "postgresql://rm:rm@localhost:5432/rmtest", REDIS_URL: "redis://localhost:6379/0" }
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --ci
      - name: Bundle check (iOS + Android JS bundles)
        run: npx expo export --platform android --platform ios --output-dir /tmp/expo-export
        env: { EXPO_OFFLINE: "1", CI: "1" }

  docker:
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner (GHCR requires lowercase names)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: backend, push: true, tags: "ghcr.io/${{ env.OWNER }}/rm-markets-api:latest,ghcr.io/${{ env.OWNER }}/rm-markets-api:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with: { context: web, push: true, tags: "ghcr.io/${{ env.OWNER }}/rm-markets-web:latest,ghcr.io/${{ env.OWNER }}/rm-markets-web:${{ github.sha }}" }

  deploy-railway:
    needs: [backend, web, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env: { RAILWAY_TOKEN: "${{ secrets.RAILWAY_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Deploy API
        run: railway up --ci --service "${{ vars.RAILWAY_API_SERVICE || 'rm-markets-api' }}" backend --path-as-root
      - name: Deploy web
        run: railway up --ci --service "${{ vars.RAILWAY_WEB_SERVICE || 'rm-markets-web' }}" web --path-as-root
